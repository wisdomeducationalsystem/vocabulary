<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --warm-white: #fff9f3;
    --teal: #1a6b6b;
    --teal-light: #2d8f8f;
    --teal-pale: #e8f5f5;
    --gold: #c89b3c;
    --gold-light: #f5e6c0;
    --text-dark: #1e2a2a;
    --text-mid: #4a5e5e;
    --text-light: #8aa0a0;
    --shadow: 0 4px 24px rgba(26,107,107,0.10);
    --shadow-hover: 0 8px 40px rgba(26,107,107,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--teal) 0%, #0f4a4a 100%);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #fff;
    letter-spacing: -0.02em;
    position: relative;
  }
  .header p {
    color: rgba(255,255,255,0.65);
    font-size: 0.88rem;
    margin-top: 6px;
    font-weight: 300;
    position: relative;
  }

  /* ── Search Bar ── */
  .search-wrap {
    max-width: 480px;
    margin: 24px auto 0;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 12px 18px 12px 44px;
    border-radius: 50px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    backdrop-filter: blur(8px);
    transition: background 0.2s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.5); }
  .search-wrap input:focus { background: rgba(255,255,255,0.22); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.6); font-size: 1rem; pointer-events: none;
  }

  /* ── Level Tabs ── */
  .levels-section {
    padding: 24px 20px 0;
    max-width: 1100px;
    margin: 0 auto;
  }
  .levels-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .levels-scroll {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .level-btn {
    padding: 8px 20px;
    border-radius: 50px;
    border: 2px solid transparent;
    background: #fff;
    color: var(--text-mid);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .level-btn:hover {
    border-color: var(--teal-light);
    color: var(--teal);
    transform: translateY(-1px);
  }
  .level-btn.active {
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
    box-shadow: 0 4px 14px rgba(26,107,107,0.3);
  }

  /* ── Stats Bar ── */
  .stats-bar {
    max-width: 1100px;
    margin: 18px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stats-count {
    font-size: 0.82rem;
    color: var(--text-light);
  }
  .stats-count span { color: var(--teal); font-weight: 600; }

  /* ── Grid ── */
  .grid {
    max-width: 1100px;
    margin: 20px auto 40px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  /* ── Card ── */
  .card-wrap {
    perspective: 1000px;
    height: 220px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .card-wrap.flipped .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute; inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* Front */
  .card-front {
    background: #fff;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
    border: 1.5px solid rgba(26,107,107,0.08);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .card-wrap:hover .card-front {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) rotateY(0deg);
  }
  .card-front .word-id {
    font-size: 0.7rem;
    color: var(--text-light);
    font-weight: 500;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .card-front .word {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--teal);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .card-front .urdu-meaning {
    font-size: 1rem;
    color: var(--text-mid);
    direction: rtl;
    font-weight: 400;
    margin-bottom: 10px;
  }
  .card-front .flip-hint {
    font-size: 0.72rem;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }
  .level-tag {
    position: absolute; top: 14px; right: 14px;
    background: var(--teal-pale);
    color: var(--teal);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 50px;
    letter-spacing: 0.06em;
  }

  /* Back */
  .card-back {
    background: linear-gradient(145deg, var(--teal) 0%, #0f4a4a 100%);
    transform: rotateY(180deg);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  .card-back .back-word {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  .card-back .meaning-en {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
    flex: 1;
  }
  .card-back .syn-ant {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 500;
  }
  .chip.syn { background: rgba(200,155,60,0.3); color: var(--gold-light); }
  .chip.ant { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); }
  .chip-label {
    font-size: 0.62rem;
    opacity: 0.6;
    margin-right: 2px;
  }
  .card-back .sentence-urdu {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    direction: rtl;
    text-align: right;
    margin-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px;
    line-height: 1.5;
  }

  /* ── Loading & Error States ── */
  .state-box {
    max-width: 440px;
    margin: 60px auto;
    text-align: center;
    padding: 0 20px;
  }
  .state-box .icon { font-size: 3rem; margin-bottom: 16px; }
  .state-box h3 {
    font-family: 'Playfair Display', serif;
    color: var(--teal);
    font-size: 1.3rem;
    margin-bottom: 8px;
  }
  .state-box p {
    color: var(--text-mid);
    font-size: 0.88rem;
    line-height: 1.7;
  }
  .state-box code {
    display: inline-block;
    background: var(--teal-pale);
    color: var(--teal);
    font-size: 0.78rem;
    padding: 8px 14px;
    border-radius: 8px;
    margin-top: 14px;
    word-break: break-all;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--teal-pale);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty State ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── Responsive ── */
  @media (max-width: 560px) {
    .header h1 { font-size: 1.5rem; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .card-wrap { height: 200px; }
    .card-front .word { font-size: 1.3rem; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>



<div id="app">
  <div class="state-box">
    <div class="spinner"></div>
    <h3>Loading Vocabulary…</h3>
    <p>Fetching words from your sheet. Make sure the sheet is published to web.</p>
  </div>
</div>

<script>
// ─── CONFIG ─────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSyvzachk1sJkmUKlJpmgteKbz-OUY9O6lgB_xawD6iay7wodPjuwAaF7OglQ1k8A77tnIims_qf1wy/pub?gid=0&single=true&output=csv';
// ────────────────────────────────────────────────────────

let allWords = [];
let activeLevel = 'All';
let searchQuery = '';

// ── CSV Parser ──
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').replace(/^"|"$/g,'').trim());
    return obj;
  }).filter(r => r['Word'] && r['Word'].length > 0);
}

// ── Render ──
function render() {
  const filtered = allWords.filter(w => {
    const matchLevel = activeLevel === 'All' || w['Level'] === activeLevel;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q ||
      (w['Word'] || '').toLowerCase().includes(q) ||
      (w['English Meaning'] || '').toLowerCase().includes(q) ||
      (w['Urdu Meaning'] || '').includes(q);
    return matchLevel && matchSearch;
  });

  const levels = ['All', ...new Set(allWords.map(w => w['Level']).filter(Boolean))];

  document.getElementById('app').innerHTML = `
    <div class="levels-section">
      <div class="levels-label">Select Class / Level</div>
      <div class="levels-scroll">
        ${levels.map(l => `
          <button class="level-btn ${l === activeLevel ? 'active' : ''}"
            onclick="setLevel('${l}')">${l}</button>
        `).join('')}
      </div>
    </div>

    <div class="stats-bar">
      <span class="stats-count">Showing <span>${filtered.length}</span> words
        ${activeLevel !== 'All' ? `in <span>${activeLevel}</span>` : ''}
        ${searchQuery ? `matching "<span>${searchQuery}</span>"` : ''}
      </span>
    </div>

    <div class="grid" id="grid">
      ${filtered.length === 0 ? `
        <div class="empty">
          <div class="icon">🔎</div>
          <p>No words found. Try a different search or level.</p>
        </div>` :
        filtered.map((w, i) => buildCard(w, i)).join('')
      }
    </div>
  `;
}

function buildCard(w, i) {
  const syn = w['Synonym'] ? `<span class="chip syn"><span class="chip-label">SYN</span>${w['Synonym']}</span>` : '';
  const ant = w['Antonym'] ? `<span class="chip ant"><span class="chip-label">ANT</span>${w['Antonym']}</span>` : '';
  const sentence = w['Sentence'] ? `<div class="meaning-en">${w['English Meaning']}<br><em style="opacity:0.7;font-size:0.78em">"${w['Sentence']}"</em></div>` :
    `<div class="meaning-en">${w['English Meaning']}</div>`;
  const urduSentence = w['Urdu Sentence'] ? `<div class="sentence-urdu">${w['Urdu Sentence']}</div>` : '';
  const idNum = w['ID'] || (i + 1);

  return `
  <div class="card-wrap" onclick="this.classList.toggle('flipped')" style="animation-delay:${(i%20)*25}ms">
    <div class="card-inner">
      <div class="card-front">
        <span class="level-tag">${w['Level'] || ''}</span>
        <div class="word-id">#${idNum}</div>
        <div class="word">${w['Word']}</div>
        <div class="urdu-meaning">${w['Urdu Meaning'] || ''}</div>
        <div class="flip-hint">↩ tap to reveal details</div>
      </div>
      <div class="card-back">
        <div class="back-word">${w['Word']}</div>
        ${sentence}
        ${(syn || ant) ? `<div class="syn-ant">${syn}${ant}</div>` : ''}
        ${urduSentence}
      </div>
    </div>
  </div>`;
}

function setLevel(level) {
  activeLevel = level;
  render();
  // re-attach search
  const si = document.getElementById('searchInput');
  if (si) { si.value = searchQuery; si.addEventListener('input', onSearch); }
}

function onSearch(e) {
  searchQuery = e.target.value;
  render();
  const si = document.getElementById('searchInput');
  if (si) { si.value = searchQuery; si.addEventListener('input', onSearch); }
}

// ── Fetch ──
async function init() {
  try {
    const resp = await fetch(CSV_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    if (text.includes('<!DOCTYPE') || text.includes('<html')) throw new Error('not_published');
    allWords = parseCSV(text);
    if (allWords.length === 0) throw new Error('empty');
    render();
    // attach search
    document.getElementById('app').addEventListener('input', e => {
      if (e.target.id === 'searchInput') onSearch(e);
    });
  } catch(err) {
    const isNotPublished = err.message === 'not_published' || err.message.includes('4');
    document.getElementById('app').innerHTML = `
      <div class="state-box">
        <div class="icon">⚠️</div>
        <h3>${isNotPublished ? 'Sheet Not Published Yet' : 'Could Not Load Sheet'}</h3>
        <p>
          To make this work, publish your Google Sheet to the web:<br><br>
          <strong>File → Share → Publish to web → Sheet1 → CSV → Publish</strong><br><br>
          Then paste the embed in Google Sites.
        </p>
        <code>${CSV_URL}</code>
      </div>`;
  }
}

init();
</script>
</body>
</html>
